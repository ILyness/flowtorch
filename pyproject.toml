[project]
name = "flowtorch"
version = "0.1.0"
description = "A visual workbench for designing and training deep learning models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "torch>=2.6",
]

[project.scripts]
flowtorch = "flowtorch.app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
docs = ["sphinx>=7.4,<9"]
